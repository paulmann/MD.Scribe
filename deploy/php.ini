; MD.Viewer 3 — recommended production PHP settings
; (copied into the container; adapt for bare-metal php.ini / pool configs)

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

expose_php = Off

memory_limit = 256M
max_execution_time = 60

upload_max_filesize = 16M
post_max_size = 17M
max_file_uploads = 20

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; NOTE: validate_timestamps=0 means code changes require an opcache reset
; (php-fpm reload). Use =1 (with revalidate_freq=2) during development.

realpath_cache_size = 4M
realpath_cache_ttl = 600
