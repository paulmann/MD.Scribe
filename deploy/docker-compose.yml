services:
  docs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mdscribe:3
    container_name: mdscribe
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Your documents — survives container rebuilds
      - ../content:/app/content
      # Cache, logs, backups, search index, custom themes
      - mdscribe-storage:/app/storage
    environment:
      # Convenience only — configuration lives in .md.ini
      TZ: UTC

volumes:
  mdscribe-storage:
