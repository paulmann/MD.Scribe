# MD.Scribe 3 — nginx production vhost (Layout A: docroot at public/)
#
# Adjust: server_name, root path, php-fpm socket, certificate paths.

server {
    listen 80;
    server_name docs.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name docs.example.com;

    root /var/www/docs/public;
    index index.php;

    # TLS (use your own cert management — e.g. certbot)
    ssl_certificate     /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers not already sent by PHP (belt & braces)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20m;   # uploads (keep ≥ MAX_UPLOAD_MB + slack)

    # Pretty fallback → front controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
        # Only the two front controllers execute:
        try_files $uri =404;
    }

    # Static assets — long cache (filenames carry ?v=mtime)
    location ~* \.(css|js|woff2|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Never serve dotfiles
    location ~ /\. { deny all; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;
}

